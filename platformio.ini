; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; see
;  https://docs.platformio.org/en/latest/projectconf/interpolation.html#projectconf-interpolation

[platformio]
#default_envs = d1_mini-1, esp32-s3-devkitc-1
#default_envs = d1_mini-1
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default.csv
board_upload.flash_size=4MB
upload_port = /dev/cu.usbmodem2101
monitor_speed = 460800
build_flags = 
    # Required to help selective code/inclusion
	-D ESP32
    # Required for the AliExpress generic 
    # ESP32-S3-Zero ESP32-C3-Zero board
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1  
    # Flags
	-D CORE_DEBUG_LEVEL=5
lib_deps =
    https://github.com/jpdw/JIOT-Core.git
    bblanchon/ArduinoJson @ ^7.2.0
# Persistent_Config is unused (main.cpp no longer calls persistent_config_setup() -
# JIOT-Core's Wlan now owns LittleFS-backed config) and doesn't build cleanly on
# ESP8266 anyway (FS API differences, see the d1_mini-1 env) - excluded rather
# than fixed, since it's dead code either way.
lib_ignore = Persistent_Config

[env:d1_mini-1]
platform = espressif8266
framework = arduino
board = d1_mini
upload_protocol = esptool
upload_port = /dev/cu.usbserial-10
upload_speed = 460800
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-10
lib_deps =
	https://github.com/jpdw/JIOT-Core.git
#	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0
lib_ignore = Persistent_Config
build_flags = 
    # Required to help selective code/inclusion
	-D ESP8266
    # Unsure where this requirement came from...
	-D FLASH_MAP_SUPPORT=1

